<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B2955">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vortex Reports">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="https://qhrpwiakobgcxfmcoyfg.supabase.co/storage/v1/object/public/acad-assets/logo.png">
<link rel="apple-touch-icon" href="https://qhrpwiakobgcxfmcoyfg.supabase.co/storage/v1/object/public/acad-assets/logo.png">
<title>Vortex Swimming Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand"><img id="logo" alt="Vortex Swimming Academy"><div><small>VORTEX AQUATICS</small><b>Swimming Academy</b></div></div>
  <div class="week" role="group" aria-label="Week">
    <button id="wPrev" aria-label="Previous week">‹</button><span id="wLabel"></span><button id="wNext" aria-label="Next week">›</button>
  </div>
  <button class="me" id="meBtn"><i id="meInit">?</i><span id="meName">Set your name</span><span class="role" id="meRole"></span></button>
</div></header>
<nav class="levels" aria-label="Levels"><div class="groups" id="groups" role="group" aria-label="Programme"></div><div class="levels-in" id="levels"></div></nav>
<main id="main">
  <div class="bar hide" id="mgBar">
    <div class="seg" role="group" aria-label="View"><button data-view="swimmers" aria-pressed="true">Swimmers</button><button data-view="overview" aria-pressed="false">Coaches overview</button><button data-view="track" aria-pressed="false">Tracking</button><button data-view="plans" aria-pressed="false">Lesson plans</button><button data-view="deck" aria-pressed="false">Decksheets</button><button data-view="calendar" aria-pressed="false">Calendar</button><button data-view="timesheet" aria-pressed="false">Timesheets</button></div>
    <select class="sel" id="coachSel" aria-label="Coach"></select>
    <div class="tools"><button class="btn primary" id="regBtn">+ Register swimmer</button><button class="btn" id="teamBtn" aria-label="Team and settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18.5 14.8c1.6.8 2.7 2.6 3 5.2"/></svg><span id="teamLbl">Team</span></button></div>
  </div>
  <section id="vSwimmers">
    <div class="bar">
      <div><h1 id="lvTitle"></h1><div class="sub" id="lvSub"></div></div>
      <div class="tools">
        <button class="btn" id="plansBtn" aria-label="Lesson plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>Lesson plans</span></button>
        <button class="btn" id="calBtn" aria-label="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/></svg><span>Calendar</span></button>
        <button class="btn" id="deckBtn" aria-label="Decksheet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 9v12"/></svg><span>Decksheet</span></button>
        <button class="btn" id="attBtn" aria-label="Attendance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 12"/></svg><span>Attendance</span></button>
        <button class="btn" id="notesBtn" aria-label="Group notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg><span>Group notes</span></button>
        <button class="btn dark" id="dlAllBtn" aria-label="Download reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg><span>Download reports</span></button>
      </div>
      <div class="prog" aria-hidden="true"><b id="progBar" style="width:0"></b></div>
    </div>
    <div class="bar">
      <div class="status" id="status"><i></i><span>Connecting…</span></div>
      <div class="tools"><button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Add swimmers</button></div>
    </div>
    <div class="bar filters" id="filters"></div>
    <div class="list" id="list"></div>
  </section>
  <section id="vOverview" class="hide"></section>
  <section id="vTimesheet" class="hide"></section>
  <section id="vDeck" class="hide"></section>
  <section id="vCal" class="hide"></section>
  <section id="vTrack" class="hide"></section>
  <section id="vPlans" class="hide"></section>
</main>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/config.js"></script>
<script src="/assets.js"></script>
<script src="/levels.js"></script>
<script src="/pdfgen.js"></script>
<script src="/app.js"></script>
<script src="/profile.js"></script>
<script src="/deck.js"></script>
<script src="/deckpdf.js"></script>
<script src="/cal.js"></script>
<script src="/sync.js"></script>
<script src="/track.js"></script>
<script src="/mobile.js"></script>
<script src="/notify.js"></script>
<script src="/plans.js"></script>
<script src="/register.js"></script>
</body>
</html>
